[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studio-agent"
version = "0.0.0"
description = "An AI agent that turns one idea into a full AI video / TV series."
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
# Real providers (kept out of the default install so the fake pipeline is dependency-free).
real = [
    "google-genai>=1.0",
    "fal-client>=0.8.0",
    "anthropic>=0.69",
]

[tool.setuptools.packages.find]
include = ["studio_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
