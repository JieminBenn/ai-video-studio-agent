# Studio Agent configuration.
# Model choice lives here, never hardcoded in stage logic (invariant #6).
# `--fake` selects the `fake` profile so the pipeline runs offline at zero cost.

default_profile: fake

default_model_options:
  llm: volcengine-deepseek-v4-flash
  image: doubao-seedream
  video: china-seedance-fast
  vlm: doubao-seed-2-lite-qc

# 分镜图 (storyboard motion-grid) keyframes for clip mode. Opt-in and default-safe:
# only active when enabled AND a grid-capable image model + a Seedance video model are
# both selected (see image_supports_storyboard_grid / video_supports_storyboard_grid).
motion_grid:
  enabled: false
  story_scenes: false    # opt-in: also use 分镜图 per scene in story mode (grid-capable only)
  layout: auto    # auto | 2x2 | 3x3 | 九宫格 | 3x4 | 十二宫格

# Advise-only story-flow review over the assembled shot list. Writes
# storyboard/shots.review.md at the human gate; never mutates shots.json.
storyboard:
  flow_review:
    enabled: true

model_options:
  llm:
    fake:
      label: "Fake LLM"
      group: "Testing / offline"
      provider: "Testing / offline"
      capabilities: [text]
      llm: fake
    # OpenAI model catalog verified 2026-06-20:
    # https://developers.openai.com/api/docs/models/all
    openai-gpt-5-5: &openai_llm
      label: "GPT-5.5"
      group: "OpenAI"
      provider: "OpenAI"
      availability: stable
      requires: [OPENAI_API_KEY]
      capabilities: [text]
      llm: openai-compatible
      llm_base_url: https://api.openai.com/v1
      llm_api_key_env: OPENAI_API_KEY
      llm_model: gpt-5.5
      llm_temperature: 0.4
      llm_timeout_s: 180.0
      llm_max_json_attempts: 3
      llm_json_response_format: true
