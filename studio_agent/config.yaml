# Image-prompt director (the LLM "prompt skill"): rewrites the compiled brief into a
# dense, model-optimized image prompt so non-experts still get good images. Turn off to
# fall back to sending the compiled brief verbatim (legacy behavior).
image_prompt_director:
  enabled: true
knowledge_retrieval:
  max_entries: 6
  max_chars: 6000
# Quality booster appended to every directed image prompt as a baseline.
image_quality_baseline: >-
  Render at the highest fidelity: sharp focus, coherent anatomy, correct hands and eyes,
  natural skin and material texture, clean edges, controlled cinematic lighting, no text,
  watermark, or logo.

# Global visual style guide defaults (the bible stage refines this per project).
# Each preset may carry a `prompt_playbook`: idiom guidance the director follows so each
# look renders authentically (render-engine cues, signature materials, lighting, palette).
default_style: cinematic
style_presets:
  cinematic:
    look: cinematic
    palette: natural
    aspect_ratio: "16:9"
    rendering: filmic naturalism
    motion: measured live-action pacing
    prompt_playbook: >-
      Shoot like a feature film on anamorphic glass and large-format sensors: motivated,
      directional key light with soft falloff, controlled contrast, gentle film grain and
      filmic color science, shallow depth of field, real locations and practical textures.
      Photoreal skin with pores, catchlights, and natural asymmetry. Avoid video-game CGI
      sheen and flat on-camera lighting.
  anime:
    look: anime
    palette: moonlit teal and warm brass
    aspect_ratio: "16:9"
    rendering: clean cel shading
    line_style: crisp expressive ink lines
    motion: controlled limited-animation timing
    prompt_playbook: >-
      Hand-drawn 2D anime / key-visual look: crisp confident line art, clean cel shading
      with 2-3 tone steps, expressive large eyes, painterly background art with depth and
      atmosphere, rim light and bloom. Think modern theatrical anime. Avoid 3D render,
      photoreal skin, muddy gradients, and stiff symmetry.
  "3d":
    look: polished semi-realistic 3D CG animation, feature-film quality
    palette: natural cinematic color that adapts to the scene and genre
    aspect_ratio: "16:9"
    rendering: cinematic PBR, subsurface-scattering skin, detailed layered costumes, groomed strand hair, refined materials
    lighting: volumetric cinematic lighting with luminous atmosphere and controlled contrast
    composition: depth-rich cinematic staging with believable scale and detailed environments
    motion: graceful weighty performance, believable physics, responsive hair and cloth dynamics
    notes: avoid plastic skin, rigid game-cutscene posing, exaggerated cartoon proportions, weak fabric detail, and weightless motion
    prompt_playbook: >-
      High-end 3D CG animated feature still, the look of a flagship animated movie rendered
      in Unreal Engine 5 / Octane: semi-realistic stylized faces with subsurface-scattering
      skin (not plastic), groomed strand hair, intricate layered costumes with simulated
      cloth, leather, and metal, refined PBR materials and rim lighting, volumetric god rays
      and luminous atmosphere, cinematic depth and believable scale. Adapt the setting,
      wardrobe, architecture, and palette to the story's own world and genre — this look
      spans any setting, from grounded modern drama to epic fantasy or sci-fi, not one
      regional style. Steer hard away from: plastic skin, stiff game-cutscene posing, flat
      cartoon proportions, flat fabric, and weightless cloth.
  cartoon:
    look: cartoon
    palette: bright candy colors
    aspect_ratio: "16:9"
    rendering: soft rounded shapes
    motion: snappy squash-and-stretch energy
    prompt_playbook: >-
      Playful modern 3D/2D cartoon (Pixar/DreamWorks-adjacent): bold rounded silhouettes,
      exaggerated appealing proportions, clean readable shapes, saturated candy palette,
      soft bouncy lighting and ambient occlusion, expressive faces. Avoid photoreal detail,
      gritty texture, and horror lighting.
  # Keyword recipe distilled from an expert MidJourney "云海之下" style set.
  mj_celestial_epic:
    look: ultra-real cinematic epic fantasy sci-fi
    palette: celestial blues, atmospheric glow, iridescent sky veils
    aspect_ratio: "16:9"
    rendering: dreamlike realism, clean sharp image, crisp edges, no noise or grain
    lighting: celestial light, god rays, dramatic cloudscape
    composition: extreme wide view, grand panoramic composition, vast depth
    motion: slow, majestic, weight-bearing camera moves
    prompt_playbook: >-
      Epic ultra-real fantasy sci-fi vista: extreme wide panoramic scale with vast depth and
      tiny figures for scale, towering cloudscapes and celestial light, god rays piercing
      sky veils, iridescent atmospheric glow, crisp clean rendering with no noise or grain,
      dreamlike hyperreal detail. Awe and grandeur. Avoid clutter, flat lighting, and grain.

# Product format presets. These shape script/storyboard planning but do not fork the
# file-based pipeline.
default_format: short_film
product_formats:
  # A single self-contained story → one video. The user sets its length (minutes);
  # the target/min/max below are the "Auto" defaults when no length is given.
  short_film:
    label: "Film"
    target_duration_s: 180
    min_duration_s: 120
    max_duration_s: 300
    structure: "setup, complication, turn, resolution"
    pacing: "cinematic scene pacing"
  # Minimal, cheap format for validating real providers end-to-end with the
  # fewest paid clips (a couple of short scenes). Hidden from the dashboard
  # dropdown (ui_hidden) but still selectable from the CLI for smoke tests.
  smoke_test:
    label: "Smoke test"
    ui_hidden: true
    target_duration_s: 30
    min_duration_s: 18
    max_duration_s: 45
    structure: "one quick setup and a single turn"
    pacing: "minimal, for cheap real-provider validation"
  # Non-narrative short video (clip) mode: one striking cinematic moment — a 抖音/TikTok
  # style shot (slow-mo walk, rotating hero shot) — with characters + location but no
  # plot/script/dialogue. Duration and clip count are per-project (see --clips/--clip-seconds).
  short_video:
    label: "Clip"
    mode: clip
    # New runs default to one clip whose length the video model decides — the CLI and
    # dashboard write clip_plan_mode (default/manual/auto) into model_config directly.
    clip_count: 1
    clip_seconds: null
    clip_target_duration_s: auto
    target_duration_s: 15
    min_duration_s: 4
    max_duration_s: 60
    structure: "a concise visual progression with a hook, development, and payoff"
    pacing: "visually driven, coherent long takes, minimal cutting"


# Cost remains tracked as a normalized USD estimate. Set a number here to opt into
# a hard per-project spending limit; new projects are unlimited by default.
cost_cap: null
