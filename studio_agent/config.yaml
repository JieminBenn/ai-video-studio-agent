    volcengine-deepseek-v4-pro:
      label: "Volcengine DeepSeek V4 Pro"
      group: "Chinese price"
      llm: openai-compatible
      llm_base_url: https://ark.cn-beijing.volces.com/api/v3
      llm_api_key_env: ARK_API_KEY
      llm_model: deepseek-v4-pro-260425
      llm_temperature: 0.55
      # Reasoning model: a rich (esp. 中文) prompt can generate for many minutes. Requests stream
      # by default (llm_stream), so this timeout is a per-chunk *stall* guard, not a whole-
      # generation deadline — it only trips if the server sends no token for this long. Kept
      # generous so a slow first token (reasoning warm-up) never aborts a healthy generation.
      llm_timeout_s: 600.0
      llm_max_json_attempts: 3
      llm_json_response_format: false
      llm_cost_per_million_input: 12.0
      llm_cost_per_million_cached_input: 1.0
      llm_cost_per_million_output: 24.0
      llm_cost_currency: CNY
      llm_usd_per_native_unit: 0.14
